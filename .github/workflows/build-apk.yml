name: Build AutoForge Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'AutoForge_Source_v*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Projekt laden
        uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

   - name: Android SDK einrichten
  uses: android-actions/setup-android@v4
  with:
    packages: ''

      - name: Android API 36 installieren
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Neueste AutoForge-Version auswählen
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'AutoForge_Source_v*.zip' -printf '%f\n' | sort -V | tail -n 1)
          if [ -z "$ZIP" ]; then
            echo 'Keine AutoForge-Source-ZIP gefunden.'
            exit 1
          fi
          echo "Verwendete Version: $ZIP"
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: AutoForge entpacken
        run: |
          rm -rf AutoForgeBuild
          mkdir AutoForgeBuild
          unzip -q "$SOURCE_ZIP" -d AutoForgeBuild
          echo "Baue: $SOURCE_ZIP"

      - name: APK bauen
        run: |
          cd AutoForgeBuild
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: AutoForge-Mobile-APK
          path: AutoForgeBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
