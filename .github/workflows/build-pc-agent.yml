name: Build AutoForge PC Setup
'on':
  push:
    branches: [main]
    paths: ['AutoForge_PC_Source_0.6.1.zip', '.github/workflows/build-pc-agent.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pc-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Quelle laden
        shell: pwsh
        run: Expand-Archive -LiteralPath AutoForge_PC_Source_0.6.1.zip -DestinationPath PCBuild
      - name: Windows-Agent bauen
        shell: pwsh
        run: dotnet publish PCBuild/apps/pc-agent/AutoForge.Desktop/AutoForge.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o PCSetup/agent
      - name: Einrichtung und Pruefsummen verpacken
        shell: pwsh
        run: |
          Copy-Item PCBuild/installer/* PCSetup/
          $root=(Resolve-Path PCSetup/agent).Path
          $manifest=@(Get-ChildItem $root -Recurse -File | ForEach-Object { @{path=[IO.Path]::GetRelativePath($root,$_.FullName);sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash} })
          ConvertTo-Json -InputObject $manifest | Set-Content PCSetup/agent-sha256.json -Encoding utf8
          Compress-Archive -Path PCSetup/* -DestinationPath AutoForge-PC-Setup.zip
          (Get-FileHash AutoForge-PC-Setup.zip -Algorithm SHA256).Hash | Set-Content AutoForge-PC-Setup.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AutoForge-PC-Setup
          path: |
            AutoForge-PC-Setup.zip
            AutoForge-PC-Setup.sha256
      - name: PC-Download bereitstellen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pc-agent-0.6.1 --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { gh release create pc-agent-0.6.1 --repo $env:GITHUB_REPOSITORY --title 'AutoForge PC-Einrichtung 0.6.1' --notes 'Windows 10/11 x64. ZIP entpacken und AutoForge installieren.cmd am PC oeffnen. Agent ohne lokale KI-Modelle. Projektbereich bleibt G:\gpt\AutoForge. Einmalige Zustimmung am PC erforderlich.' }
          gh release upload pc-agent-0.6.1 AutoForge-PC-Setup.zip AutoForge-PC-Setup.sha256 --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'PC-Download konnte nicht bereitgestellt werden' }

